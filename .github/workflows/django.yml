name: Odoo Addons Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Addons
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone Odoo Source
        run: |
          git clone --depth 1 --branch 16.0 https://github.com ../odoo
          pip install -r ../odoo/requirements.txt

      - name: Run Odoo Tests
        run: |
          python3 ../odoo/odoo-bin -d test_db --db_host=localhost --db_port=5432 -r odoo -w odoo --addons-path=../odoo/addons,. -i اسم_الموديول_الخاص_بك --test-enable --stop-after-init
